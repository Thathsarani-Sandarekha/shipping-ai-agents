name: Suggest a topic
description: Suggest a topic for a new notebook or chapter.
title: "[Topic] "
labels: ["topic idea"]
body:
  - type: input
    id: title
    attributes:
      label: Topic
      placeholder: "Running agents that call other agents"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What do you want to understand?
      description: The question you would like answered, or the problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: outline
    attributes:
      label: Anything else?
      description: Links, examples, or where it fits among the existing chapters.
  - type: checkboxes
    id: write
    attributes:
      label: Helping out
      options:
        - label: I'd like to help write this.
