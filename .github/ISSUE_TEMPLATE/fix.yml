name: Mistake or outdated fact
description: Something in a chapter is wrong, unclear or no longer true.
title: "[Fix] "
labels: ["fix"]
body:
  - type: input
    id: chapter
    attributes:
      label: Chapter
      placeholder: "Chapter 8: What happens to a conversation"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: Quote the sentence or command if you can.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What should it say?
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the official documentation, a changelog or a release note.
